name: Staleness Review

on:
  schedule:
    # First of every month at 09:00 UTC
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

concurrency:
  group: staleness-review
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  staleness-review:
    name: Check links and escalate stale integrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: .github/scripts/staleness-review
        run: npm ci --ignore-scripts

      - name: Run staleness review
        id: review
        working-directory: .github/scripts/staleness-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: npx tsx src/index.ts

      - name: Open PR with staleness changes
        if: steps.review.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add integrations/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            BRANCH="staleness-review/$(date -u +%Y-%m-%d)"
            git checkout -B "$BRANCH"
            git commit --signoff -m "chore: update stale integrations (banners and deprecations)"
            git push --set-upstream origin "$BRANCH" --force
            gh pr create \
              --title "chore: staleness review $(date -u +%Y-%m-%d)" \
              --body "Automated staleness review run. Updates warning banners and deprecation status for stale integrations." \
              --label "stale"
          fi
