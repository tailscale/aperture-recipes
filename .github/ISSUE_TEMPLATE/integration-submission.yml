name: Integration submission
description: Submit an Aperture integration for review. Use this if you prefer not to open a pull request directly.
title: "[Integration] "
labels: ["integration-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting an integration! This form mirrors the [integration template](https://github.com/tailscale/aperture-catalog/blob/main/templates/integration.md). After review, a maintainer may convert this into a PR on your behalf or ask you to open one.

        Only **Integration name**, **Integration type**, and **Summary** are required. Fill in as much as you can; the review team will work with you on any gaps.

        **Helpful references:**
        - [Aperture documentation](https://tailscale.com/docs/aperture): product overview and getting started
        - [Configuration reference](https://tailscale.com/docs/aperture/configuration): grants, hooks, providers, and quotas
        - [Guardrails guide](https://tailscale.com/docs/aperture/guardrails): conceptual guide to pre-request hooks
        - [Build a custom webhook](https://tailscale.com/docs/aperture/how-to/build-custom-webhook): step-by-step hook tutorial
        - [Template README](https://github.com/tailscale/aperture-catalog/blob/main/templates/README.md): section-by-section guidance

  - type: input
    id: integration-name
    attributes:
      label: Integration name
      placeholder: "for example, Acme PII Scrubber"
    validations:
      required: true

  - type: input
    id: provider-name
    attributes:
      label: Provider / company name
      placeholder: "for example, Acme Corp"
    validations:
      required: false

  - type: input
    id: provider-url
    attributes:
      label: Provider URL
      placeholder: "https://example.com"
    validations:
      required: false

  - type: dropdown
    id: integration-type
    attributes:
      label: Integration type
      description: "Primary type. Refer to the [Aperture configuration reference](https://tailscale.com/docs/aperture/configuration) for how each type is configured."
      options:
        - Pre-request hook
        - Post-response hook
        - Provider
        - Tool
    validations:
      required: true

  - type: input
    id: additional-types
    attributes:
      label: Additional types
      description: "If this integration supports multiple event types through the same endpoint, list secondary types here. Leave blank for single-type integrations."
      placeholder: "for example, post_response_hook"
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated lowercase hyphenated tags for categorization. Refer to the [template README](https://github.com/tailscale/aperture-catalog/blob/main/templates/README.md#frontmatter-tags) for common values."
      placeholder: "guardrail, security, pii-redaction"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "What this integration does and why an Aperture user would want it. Include what problem it solves and what gap it fills."
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: "What the user needs before setting this up. Include requirements from both the [Aperture](https://tailscale.com/docs/aperture) side (running instance, version, etc.) and the external service side (account, API key, endpoint, etc.)."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: setup
    attributes:
      label: Setup and configuration
      description: "Step-by-step instructions to configure the external service. Number each step, start with an imperative verb, and include working examples inline (sample requests, expected responses, config snippets)."
      render: markdown
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ### Aperture configuration

        **Hook integrations** (`pre_request_hook`, `post_response_hook`): fill in *Hook definition* and *Grant wiring* below. Refer to the [hook configuration reference](https://tailscale.com/docs/aperture/configuration#hooks) for the full field list.

        **Provider and tool integrations**: skip *Hook definition*, and use *Grant wiring* to show your [grant configuration](https://tailscale.com/docs/aperture/configuration#grants).

  - type: textarea
    id: hook-definition
    attributes:
      label: Hook definition
      description: "Hook integrations only. The hook entry for the [`hooks` map](https://tailscale.com/docs/aperture/configuration#hooks) in your Aperture config file. Include the endpoint URL, recommended timeout, fail policy, and any integration-specific values."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: grant-wiring
    attributes:
      label: Grant wiring
      description: |
        For hook integrations: the `send_hooks` entry that activates the hook. Include only the events and send values this integration needs.
        For provider/tool integrations: the relevant [grant configuration](https://tailscale.com/docs/aperture/configuration#grants).
        Note: [tailnet policy grants](https://tailscale.com/kb/1337/acl-syntax#grants) require an explicit `dst` key. Omitting it causes the grant to silently apply to nothing. Config-file grants do not use `dst`.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: hook-response-format
    attributes:
      label: Hook response format
      description: "Pre-request hooks only. What actions your hook returns (allow, block, modify) with example JSON responses. If your hook uses `modify`, note the [cache impact](https://tailscale.com/docs/aperture/configuration#hook-response-format). Leave blank for post-response hooks."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: verify
    attributes:
      label: Verify the integration
      description: "How to verify the integration is working correctly. Include specific test steps, expected outcomes, and example commands."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: troubleshooting
    attributes:
      label: Troubleshooting
      description: "Common issues and resolutions. Encouraged for hook integrations where configuration issues are common."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: "What data leaves the Aperture perimeter, what credentials are required and how they should be stored, whether the hook sees plaintext content. Do not include real credentials or tokens."
    validations:
      required: false

  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance and support
      description: "Who maintains this integration, how to reach them, and where to report bugs."
      placeholder: |
        - Maintainer:
        - Contact:
        - Issue reporting:
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: "Links to external documentation, guides, or API references. The [Aperture docs](https://tailscale.com/docs/aperture) and [configuration reference](https://tailscale.com/docs/aperture/configuration) are good starting points."
      render: markdown
    validations:
      required: false
